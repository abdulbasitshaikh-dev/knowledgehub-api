services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: knowledgehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_codespaces_data:/var/lib/postgresql/data
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d knowledgehub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    network_mode: host
    command: ["run", "--host", "0.0.0.0", "--port", "8001", "--path", "/data"]
    volumes:
      - chroma_codespaces_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  migrate:
    build: .
    network_mode: host
    env_file:
      - .env.codespaces
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    network_mode: host
    env_file:
      - .env.codespaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/code/uploads
    restart: unless-stopped

  worker:
    build: .
    network_mode: host
    env_file:
      - .env.codespaces
    command: celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/code/uploads
    restart: unless-stopped

volumes:
  postgres_codespaces_data:
  chroma_codespaces_data: