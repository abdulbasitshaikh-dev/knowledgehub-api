name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledgehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d knowledgehub_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/knowledgehub_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/knowledgehub_test
          SECRET_KEY: ci-test-secret
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 10080
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest
